name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host render and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the firmware on the host
        run: tests/run_host.sh
      - name: Check the render
        run: python3 tools/wavcheck.py build/host/witchbox.wav
      - name: No floats, no 64-bit division in the WitchBox sources
        run: tests/check_sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: host-render
          path: |
            build/host/witchbox.wav
            build/host/*.png

  firmware:
    name: FM-1 package (.fwsc)
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - name: Cache the JieLi toolchain and SDK files
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.jieli
            ~/fw-AC79_AIoT_SDK
          key: jieli-toolchain-v1-${{ hashFiles('tools/get_toolchain.sh', 'tools/get_sdk.sh') }}
      - name: Fetch the JieLi toolchain (clang for pi32v2)
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/get_toolchain.sh
      - name: Fetch the three SDK files
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/get_sdk.sh
      - name: Build the package
        run: |
          pip3 install --quiet Pillow
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi
          ls -l build/*.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: witchbox-fwsc
          path: |
            build/*.fwsc
            build/witchbox.dis
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.fwsc
          generate_release_notes: true
